<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="FactGuardian — factual consistency auditing for long documents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#131f3a"/>
      <stop offset="100%" stop-color="#1b2f52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1050" cy="40" r="160" fill="#38bdf8" opacity="0.07"/>
  <circle cx="150" cy="280" r="140" fill="#818cf8" opacity="0.08"/>

  <g transform="translate(72, 74)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#accent)" opacity="0.16"/>
    <path d="M32 12 L50 20 V34 C50 44 42 51 32 55 C22 51 14 44 14 34 V20 Z"
          fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M23 33 L29 39 L42 26" fill="none" stroke="#7dd3fc" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="156" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46"
        font-weight="700" fill="#f8fafc">FactGuardian</text>
  <text x="72" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20"
        fill="#cbd5e1">Audit long documents for factual consistency — before your reviewers do.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e2e8f0">
    <rect x="72" y="204" width="196" height="38" rx="19" fill="#ffffff" opacity="0.07"/>
    <text x="170" y="229" text-anchor="middle">Fact extraction</text>

    <rect x="282" y="204" width="206" height="38" rx="19" fill="#ffffff" opacity="0.07"/>
    <text x="385" y="229" text-anchor="middle">Conflict detection</text>

    <rect x="502" y="204" width="212" height="38" rx="19" fill="#ffffff" opacity="0.07"/>
    <text x="608" y="229" text-anchor="middle">Source verification</text>

    <rect x="728" y="204" width="196" height="38" rx="19" fill="#ffffff" opacity="0.07"/>
    <text x="826" y="229" text-anchor="middle">Image ↔ text check</text>
  </g>

  <text x="72" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14"
        fill="#94a3b8">FastAPI · Redis · React + Vite · Docker Compose · LLM + vision APIs</text>
</svg>
